[build]
  publish = "."

# Proxy backend paths straight to the CIPHER FastAPI server — everything else
# on this domain stays the static marketing site. Netlify does not forward
# X-Forwarded-Host to the origin (confirmed empirically), so the backend
# uses a fixed PUBLIC_BASE_URL env var to know its own public domain for
# building correct redirect URLs — update that env var if this domain changes.
[[redirects]]
  from = "/admin/*"
  to = "http://136.119.32.195:8001/admin/:splat"
  status = 200

[[redirects]]
  from = "/partner/*"
  to = "http://136.119.32.195:8001/partner/:splat"
  status = 200

# Bare /portal (no filename) sends people straight to the login page instead
# of 404ing. Must come before the /portal/* wildcard below — Netlify matches
# redirects top-to-bottom, first match wins.
[[redirects]]
  from = "/portal"
  to = "/portal/login.html"
  status = 301

[[redirects]]
  from = "/portal/"
  to = "/portal/login.html"
  status = 301

[[redirects]]
  from = "/portal/*"
  to = "https://cipher-client-portal.netlify.app/:splat"
  status = 200

# Convenience redirects for bare client-portal paths people type/click without
# the /portal prefix or .html extension (e.g. a bookmarked /forgot-password).
[[redirects]]
  from = "/login"
  to = "/portal/login.html"
  status = 301

[[redirects]]
  from = "/forgot-password"
  to = "/portal/forgot-password.html"
  status = 301

[[redirects]]
  from = "/set-password"
  to = "/portal/set-password.html"
  status = 301

[[redirects]]
  from = "/leads"
  to = "/portal/leads.html"
  status = 301

[[redirects]]
  from = "/settings"
  to = "/portal/settings.html"
  status = 301

[[redirects]]
  from = "/notifications"
  to = "/portal/notifications.html"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "http://136.119.32.195:8001/api/:splat"
  status = 200

# Backend-served static assets (favicon, installer download link used in the
# admin panel) - without this, anything under /static/ 404s when the admin/
# partner panels are viewed through this proxy domain.
[[redirects]]
  from = "/static/*"
  to = "http://136.119.32.195:8001/static/:splat"
  status = 200
